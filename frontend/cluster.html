<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8"/>
        <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
        <script type="module" src="src/app.js"></script>
        <script type="module" src="src/ui.js"></script>
        <link rel="stylesheet" href="slider.css">
        <title>FX board</title>
        <link rel="icon" href="data:,">
        <style>
            #layout {display: grid; grid-template-columns: 1fr 1fr; gap: 20px;}
            #timeseries { width: 100%; height: 100%; }
            #map, #heatmap { height: 500px; }
        </style>
    </head>
    <body>
        <div id="menu-toggle">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
        
        <div id="sidebar" class="sidebar">
            <a href="javascript:void(0)" class="closebtn">&times;</a>
            <div class="sidebar-header">NEER Analytics</div>
            <hr style="border: 0.5px solid #1e293b; margin: 0 20px;">
            <a href="index.html" class="menu-item">Trend Analysis</a>
            <a href="cluster.html" class="menu-item">Cluster Analysis</a>
        </div>
        <div id="overlay"></div>

        <h2>Cluster analysis</h2>
        <div id="layout">
            <div class="chart-card">
                <div id="timeseries"></div>
            </div>

            <div class="controls-section">
                <div class="controls-row">
                    <div class="date-display" style="height: 40px; align-items: center;">
                        <label>Start: <input type="date" id="startDate"></label>
                        <label>End: <input type="date" id="endDate"></label>
                    </div>
                    <div class="date-display" style="height: 40px; align-items: center;">
                        <label><input type="radio" name="scaleChoice" id="scaleDefault" value="default" checked><label id="NEER_BASE_YEAR"></label></label>
                        <label><input type="radio" name="scaleChoice" id="scaleStartDate" value="startDate">Start Date</label>
                        <script src="./src/configByBackend.js"></script>
                        <script>
                            document.getElementById("NEER_BASE_YEAR").innerHTML = `Default (100 = ${NEER_BASE_YEAR} LEVEL)`
                        </script>
                    </div>
                </div>
            </div>
            <div id="map"></div>
            <div id="heatmap"></div>
        </div>
    </body>
</html>
